org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# Keep native libs compressed in the AAB. Play Console only enforces 16 KB
# page-size alignment on UNCOMPRESSED native libs in generated split APKs;
# leaving them compressed sidesteps that check entirely. This matches the
# manual build setup that Play has been accepting.
android.bundle.enableUncompressedNativeLibs=false